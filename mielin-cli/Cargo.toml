[package]
name = "mielin-cli"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Command-line interface and control plane for MielinOS distributed agent mesh"
keywords = ["cli", "command-line", "control-plane", "mesh", "management"]
categories = ["command-line-utilities", "os"]
readme = "README.md"
documentation = "https://docs.rs/mielin-cli"

[[bin]]
name = "mielinctl"
path = "src/main.rs"

[dependencies]
clap = { workspace = true, features = ["derive"] }
clap_complete.workspace = true
tokio.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
toml.workspace = true
tabled.workspace = true
comfy-table.workspace = true
chrono.workspace = true
uuid.workspace = true
dirs.workspace = true
regex.workspace = true
rustyline.workspace = true
rand.workspace = true
rhai.workspace = true
reqwest.workspace = true
axum.workspace = true
tower.workspace = true
tower-http.workspace = true

mielin-cells.workspace = true
mielin-mesh-core.workspace = true
mielin-wasm.workspace = true
mielin-hal.workspace = true

[dev-dependencies]
rstest.workspace = true
assert_cmd = "2.2"
predicates = "3.1.4"
criterion.workspace = true
serial_test.workspace = true

[[bench]]
name = "cli_benchmarks"
harness = false
