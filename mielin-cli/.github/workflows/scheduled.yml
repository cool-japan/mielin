name: Scheduled Maintenance

on:
  schedule:
    # Run every Monday at 00:00 UTC
    - cron: '0 0 * * 1'
  workflow_dispatch: # Allow manual trigger

env:
  CARGO_TERM_COLOR: always

jobs:
  # Check for dependency updates
  dependency-updates:
    name: Check Dependency Updates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-outdated
        run: cargo install cargo-outdated

      - name: Check for outdated dependencies
        run: |
          echo "=== Outdated Dependencies ===" > outdated.txt
          cargo outdated >> outdated.txt || true
          cat outdated.txt

      - name: Create issue if dependencies are outdated
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const outdated = fs.readFileSync('outdated.txt', 'utf8');

            if (outdated.includes('->')) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: 'Weekly Dependency Update Check',
                body: `Outdated dependencies detected:\n\n\`\`\`\n${outdated}\n\`\`\`\n\nPlease review and update as needed.`,
                labels: ['dependencies', 'maintenance']
              });
            }

  # Security audit
  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-audit
        run: cargo install cargo-audit

      - name: Run security audit
        id: audit
        run: |
          cargo audit 2>&1 | tee audit.txt
        continue-on-error: true

      - name: Create issue if vulnerabilities found
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const audit = fs.readFileSync('audit.txt', 'utf8');

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: 'Security Vulnerabilities Detected',
              body: `Security audit found vulnerabilities:\n\n\`\`\`\n${audit}\n\`\`\`\n\n**Action Required:** Please review and update affected dependencies.`,
              labels: ['security', 'priority-high']
            });

  # Check code quality metrics
  code-quality:
    name: Code Quality Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install tokei
        run: cargo install tokei

      - name: Count lines of code
        run: |
          echo "=== Code Metrics ===" > metrics.txt
          tokei . >> metrics.txt
          cat metrics.txt

      - name: Run clippy with strict lints
        run: |
          cargo clippy --all-features --all-targets -- -D warnings -W clippy::all -W clippy::pedantic 2>&1 | tee clippy.txt
        continue-on-error: true

      - name: Upload metrics
        uses: actions/upload-artifact@v4
        with:
          name: code-metrics
          path: |
            metrics.txt
            clippy.txt
