name: Feature Request
description: Suggest a new feature or enhancement for MielinOS kernel
title: "[FEATURE] "
labels: ["enhancement", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting a feature! Please fill out the form below to help us understand your request.

  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: Is your feature request related to a problem? Please describe.
      placeholder: I'm always frustrated when... / It would be useful to have...
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: Describe the solution you'd like to see.
      placeholder: Add support for... / Implement a new API that...
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Have you considered any alternative solutions or workarounds?
      placeholder: I tried using... but it doesn't work because...

  - type: dropdown
    id: category
    attributes:
      label: Feature Category
      description: Which area does this feature belong to?
      options:
        - Memory Management
        - Scheduler
        - Virtual Memory (VMM)
        - Interrupts & Timers
        - Power Management
        - Real-Time Features
        - Multi-Core (SMP)
        - IPC
        - Architecture Support
        - Developer Experience
        - Documentation
        - Testing
        - Performance
        - Other
    validations:
      required: true

  - type: dropdown
    id: priority
    attributes:
      label: Priority
      description: How important is this feature to you?
      options:
        - Critical (blocking my use case)
        - High (significant improvement)
        - Medium (nice to have)
        - Low (minor enhancement)
    validations:
      required: true

  - type: textarea
    id: use-case
    attributes:
      label: Use Case
      description: Describe the specific use case for this feature.
      placeholder: |
        I'm building a system that needs to...
        This feature would allow me to...
    validations:
      required: true

  - type: textarea
    id: api-proposal
    attributes:
      label: Proposed API (if applicable)
      description: If you have an idea for the API, please share it here.
      render: rust
      placeholder: |
        // Example API
        pub fn new_feature(&self, param: usize) -> Result<(), KernelError> {
            // ...
        }

  - type: textarea
    id: implementation
    attributes:
      label: Implementation Ideas
      description: Do you have ideas about how to implement this feature?
      placeholder: This could be implemented by... / It might require changes to...

  - type: checkboxes
    id: contribution
    attributes:
      label: Contribution
      description: Are you willing to contribute to this feature?
      options:
        - label: I am willing to implement this feature myself
        - label: I can help test this feature
        - label: I can help with documentation
        - label: I can provide feedback during development

  - type: textarea
    id: examples
    attributes:
      label: Examples from Other Systems
      description: Are there similar features in other kernels or operating systems?
      placeholder: Linux has... / FreeBSD implements this as... / Real-Time Linux (PREEMPT_RT) provides...

  - type: checkboxes
    id: checklist
    attributes:
      label: Pre-submission Checklist
      description: Please confirm the following before submitting.
      options:
        - label: I have searched existing issues and PRs to ensure this is not a duplicate.
          required: true
        - label: This feature aligns with MielinOS kernel's goals (embedded, real-time, multi-arch).
          required: true
        - label: I have described a clear use case for this feature.
          required: true

  - type: textarea
    id: additional
    attributes:
      label: Additional Context
      description: Add any other context, screenshots, or references about the feature request.
      placeholder: Links to research papers, specifications, or related discussions...
