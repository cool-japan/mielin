[package]
name = "mielin-wasm"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "WebAssembly sandboxing and execution runtime for agent cells using Wasmtime"
keywords = ["wasm", "webassembly", "sandbox", "runtime", "wasmtime"]
categories = ["wasm", "os", "network-programming"]
readme = "README.md"
documentation = "https://docs.rs/mielin-wasm"

[features]
default = []
persistent-cache = []
preview2 = ["dep:wasmtime-wasi"]

[dependencies]
wasmtime.workspace = true
wasmtime-wasi = { workspace = true, optional = true }
anyhow.workspace = true
thiserror.workspace = true
rand.workspace = true

mielin-cells.workspace = true
mielin-hal.workspace = true
mielin-tensor.workspace = true

[dev-dependencies]
rstest.workspace = true
wat.workspace = true
tokio.workspace = true
tempfile = "3.27"
criterion.workspace = true

[[bench]]
name = "wasm_benchmarks"
harness = false
